# Smithery configuration for @wundervault/mcp-server
# https://smithery.ai/docs
#
# NOTE: this is a LOCAL stdio server. It holds no secrets: it passes each request to
# the Wundervault broker, which runs under its own account on the same computer and
# holds the agent's credentials. Before it can work, install the broker, pair it with
# your vault, and enrol the agent: https://wundervault.com/install
# A hosted/container deployment starts and serves introspection, but the vault tools
# need the local broker.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - agentName
    properties:
      agentName:
        type: string
        description: "The agent's name exactly as it appears in your vault, enrolled on this computer with `wundervault-agent --enrol`."
  commandFunction: |
    (config) => ({
      command: 'wundervault-mcp',
      env: {
        WUNDERVAULT_AGENT_NAME: config.agentName
      }
    })
