# Smithery configuration for @wundervault/mcp-server
# https://smithery.ai/docs
#
# NOTE: this server reads vault credentials from the local wundervault-agent
# daemon (unix socket under ~/.wundervault/agents/), not from env vars — run
# onboard.py first. It is a LOCAL stdio server; a hosted/container deployment
# starts and serves introspection, but the vault tools need the local daemon.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - agentName
    properties:
      agentName:
        type: string
        description: "Agent name registered with the local wundervault-agent daemon (run onboard.py to register)."
      agentToken:
        type: string
        description: "Optional daemon auth token. Defaults to ~/.wundervault/agents/<agentName>.token."
  commandFunction: |
    (config) => ({
      command: 'wundervault-mcp',
      env: {
        WUNDERVAULT_AGENT_NAME: config.agentName,
        ...(config.agentToken ? { WUNDERVAULT_AGENT_TOKEN: config.agentToken } : {})
      }
    })
